<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="guide-name" content="API Reference" />
    <meta name="service-name" content="AWS SDK for .NET Version 4" />
    {themeBootstrap}
    <link rel="stylesheet" type="text/css" href="./resources/aws-docs.css{cssVersionQuery}" media="screen">
    <!-- Same icon DocShell names on every generated page: this is a bookmarkable
         root document too, and hosts without an origin-root /favicon.ico
         (previews, mirrors, unzipped local docs) show nothing otherwise. -->
    <link rel="icon" href="./favicon.ico">
    <title>API Reference - Table of Contents | AWS SDK for .NET Version 4</title>
</head>
<body class="standalone">
    <!--
        Static, fully-linked table of contents. The interactive sidebar is
        hydrated client-side from toc.json by app.js; this page is a
        crawlable / no-JavaScript fallback listing every namespace and type.
        Every link is a real URL, so search engines and JS-disabled clients
        can still reach all pages.
    -->
    <main id="main" role="main">
        <div class="content-shell">
            <div id="pageHeader">
                <div id="titles">
                    <h1>API Reference Contents</h1>
                    <h2 class="subtitle">AWS SDK for .NET Version 4</h2>
                </div>
            </div>
            <div id="pageContent">
                <div id="toc">{TOC}</div>
            </div>
        </div>
    </main>
</body>
</html>
