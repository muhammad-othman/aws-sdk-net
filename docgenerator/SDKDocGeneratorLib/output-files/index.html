<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AWS SDK for .NET Version 4 Documentation</title>
    <meta name="description" content="AWS SDK for .NET Version 4 API Reference Documentation">
    <meta name="guide-name" content="API Reference">
    <meta name="service-name" content="AWS SDK for .NET Version 4">
    <link rel="canonical" href="https://docs.aws.amazon.com/sdkfornet/v4/apidocs/index.html">
    <link rel="shortcut icon" href="favicon.ico"/>
    <!-- This page only flashes briefly before the redirect; avoid a white blink
         for dark-theme readers. Same pre-paint bootstrap as DocShell (stored
         choice, else OS preference — keep the copies identical); this page loads
         no aws-docs.css, so the two theme palettes live in the style block. -->
    <script>(function(){var t=null;try{t=localStorage.getItem('awsdocs-theme');}catch(e){}if(t!=='light'&&t!=='dark'){try{t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}catch(e){t='light';}}document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        html { background: #ffffff; color: #1b2532; color-scheme: light; }
        html[data-theme="dark"] { background: #0f1620; color: #e6e9ee; color-scheme: dark; }
        /* No-JS fallback (the noscript path below): the bootstrap script always
           sets data-theme when it runs, so this only fires with JS disabled. */
        @media (prefers-color-scheme: dark) {
            html:not([data-theme]) { background: #0f1620; color: #e6e9ee; color-scheme: dark; }
        }
        body { font-family: system-ui, sans-serif; margin: 2rem; }
    </style>
    <script>
        /*
         * Bootstrap + legacy redirect shim.
         *
         * The doc set used to be a <frameset> driven by
         * index.html?page=<file>&tocid=<id>. Pages are now standalone
         * documents navigated in place by htmx, so this page only:
         *   1. Honors old ?page= bookmarks / RedirectWriter links by
         *      forwarding to the canonical /items/<page> URL. Two legacy
         *      repairs carried over from the old frameset loader:
         *      underscores are stripped (generated filenames never contain
         *      them, but pre-v4 bookmarks did), and a folder-less page value
         *      is resolved to its items/<Service>/ sub-folder via toc.json
         *      (the old TOC frame did this through its tocid lookup).
         *   2. Otherwise sends visitors to the landing page.
         */
        (function () {
            // decodeURIComponent throws on malformed escapes ("?page=%zz" from a
            // mangled bookmark); fall back to the raw text so one bad pair can't
            // kill the whole bootstrap (not even the default redirect would run).
            function dec(s) {
                try { return decodeURIComponent(s); } catch (e) { return s; }
            }

            function parseQuery() {
                var q = {}, s = window.location.search.replace(/^\?/, "");
                if (!s) return q;
                s.split("&").forEach(function (pair) {
                    var kv = pair.split("=");
                    q[dec(kv[0])] = dec((kv[1] || "").replace(/\+/g, " "));
                });
                return q;
            }

            function go(target) {
                window.location.replace(target);
            }

            var params = parseQuery();

            if (!params.page) {
                go("./items/sdk-api-home.html");
                return;
            }

            // Deprecated-bookmark repair, same as the old frameset loader.
            var page = params.page.replace(/_/g, "");
            var fallback = "./items/" + page;

            // Already folder-qualified (or nothing to resolve with): forward as-is.
            if (page.indexOf("/") !== -1 || !window.fetch) {
                go(fallback);
                return;
            }

            // Folder-less legacy value: resolve the page through toc.json — by the
            // tocid param FIRST (exact and service-scoped; member pages carry their
            // declaring type's tocid, so only the folder is reused), then by the
            // page's own filename (a suffix heuristic — duplicate type names exist
            // under many service folders — kept as fallback for tocid-less
            // bookmarks). Any failure → fallback.
            fetch("./toc.json")
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (toc) {
                    if (!toc || !toc.namespaces) { go(fallback); return; }

                    function findEntry(pred) {
                        for (var i = 0; i < toc.namespaces.length; i++) {
                            var ns = toc.namespaces[i];
                            if (ns.href && pred(ns)) return ns;
                            var nodes = ns.nodes || [];
                            for (var j = 0; j < nodes.length; j++) {
                                if (nodes[j].href && pred(nodes[j])) return nodes[j];
                            }
                        }
                        return null;
                    }

                    var target = null;
                    if (params.tocid) {
                        var byId = findEntry(function (e) { return e.id === params.tocid; });
                        if (byId) {
                            var kind = page.charAt(0);
                            target = (kind === "T" || kind === "N")
                                ? byId.href
                                : byId.href.slice(0, byId.href.lastIndexOf("/") + 1) + page;
                        }
                    }
                    if (!target) {
                        var suffix = "/" + page;
                        var byFile = findEntry(function (e) {
                            return e.href.slice(-suffix.length) === suffix;
                        });
                        if (byFile) target = byFile.href;
                    }

                    if (target) {
                        go(target.charAt(0) === "." ? target : "./" + target);
                    } else {
                        go(fallback);
                    }
                })
                .catch(function () { go(fallback); });
        })();
    </script>
</head>

    <noscript>
        <p>This documentation requires JavaScript. Browse the
